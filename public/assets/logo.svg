<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 120" width="560" height="120">
  <defs>
    <linearGradient id="netflixRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#B20710" />
    </linearGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E50914" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FF1E27" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Netflix-Style "N" Symbol -->
  <g transform="translate(10, 10)">
    <!-- Left Vertical Bar -->
    <rect x="10" y="10" width="22" height="80" fill="url(#netflixRedGrad)" rx="2"/>
    <!-- Right Vertical Bar -->
    <rect x="68" y="10" width="22" height="80" fill="url(#netflixRedGrad)" rx="2"/>
    <!-- Diagonal Stream Ribbon -->
    <path d="M10,10 L68,90 L90,90 L32,10 Z" fill="#E50914" filter="url(#glowFilter)"/>
    <path d="M10,10 L68,90 L90,90 L32,10 Z" fill="url(#netflixRedGrad)"/>
  </g>

  <!-- NEXASTREAM Text -->
  <text x="125" y="72" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="50" fill="#FFFFFF" letter-spacing="2">NEXA<tspan fill="#E50914">STREAM</tspan></text>

  <!-- Version Tag Badge -->
  <rect x="475" y="38" width="55" height="26" rx="5" fill="#E50914" />
  <text x="502.5" y="55" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="14" fill="#FFFFFF" text-anchor="middle">v2</text>
</svg>
